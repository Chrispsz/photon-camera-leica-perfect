name: Build & Release APK

# Builds the Photon Camera fork (Leica Perfect v6.6.2 ABSOLUTE) from upstream
# bjzhou/PhotonCamera 1.26.1 + surgical patches, then publishes the APK as a rolling
# GitHub Release (tag "latest") for fast CDN-backed download.
#
# ABSOLUTE build: NO_MENU=1 (no mod menu UI — mode_max baked from JSON config).
# ccache enabled for faster native C/C++ recompilation.
# v6.6.0: Round 09 hardware-aware pipeline fixes — 4 new patches (P-80..P-84) to make
#   Photon surpass stock in ALL scenarios, not just 80%:
#   P-80: Software LSC radial correction (kill residual color vignette in shadows)
#   P-81: QuadBayer remosaic detection (fix 50% resolution loss on OV50E!)
#   P-83: Night mode dedicated (1-3s long exposure + multi-frame stacking)
#   P-84: ZSL circular buffer (zero shutter lag — 5-frame ring)
#   All v6.5.x fixes preserved (force_dcp_id=null, awb_clamp.enabled=false, multi-frame ON).
# v6.5.3: Round 08 polish — config-only tuning (24 params across 8 sections) based on VLM
#   comparative analysis of 6 beach photos (2x Leica Authentic + 2x Leica Vibrante + 2x Photon v6.5.2).
#   Goal: polish Photon to match Leica Authentic reference. Eliminates residual ciano/green tint,
#   restores natural green/blue saturation, kills halos and oil-painting, protects highlights/shadows.
#   Preserves all v6.5.1+v6.5.2 fixes (force_dcp_id=null, awb_clamp.enabled=false, multi-frame stacking).
# v6.5.2: Round 06 fix — awb_clamp.disabled (ROOT CAUSE of green cast in PREVIEW).
# v6.5.1: Round 06 — DCP CCD removed + multi-frame stacking re-enabled.
# v6.5.0: VLM-driven pipeline fixes — 6 upgrades (U-01..U-06) based on 5 rounds of comparative testing:
#   U-01: Denoise shadow reinforcement (NLM shadow-band boost + per-lens noise model)
#   U-02: Adaptive sharpening (-40% amount + edge mask + noise gate + brightness-adaptive)
#   U-03: Bilateral → guided filter (kills HDR halos in ShadowsHighlightsShader)
#   U-04: Detail preserve wiring (eliminates oil-painting effect in chroma denoise)
#   U-05: AWB CCT clamping (M9 CCD stabilization imported to default AUTO mode)
#   U-06: AE histogram feedback (highlight/shadow protection with per-frame histogram)
# APK + fragments + 7z supercompressed archive published to the `latest` release.
#
# Rolling `latest` release URL (always the newest green build):
#   https://github.com/Chrispsz/photon-camera-leica-perfect/releases/download/latest/LeicaPerfect-v6.6.2-debug.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      NO_MENU: "1"
    steps:
      - name: Checkout fork (patches + config + build script)
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components + ccache + p7zip
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache p7zip-full
          ccache --version | head -1
          7z | head -2
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          echo "--- installed NDKs ---"
          ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-ndk27-${{ hashFiles('patches/*.kt', 'build-archlinux.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-ndk27-

      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NO_MENU=$NO_MENU"
          java -version
          ccache --version | head -1
          git --version
          nproc
          free -h

      - name: Build (clone upstream + patch + gradle assembleDefaultDebug — v6.6.2)
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 2G 2>/dev/null || true
          chmod +x build-archlinux.sh
          ANDROID_HOME="$ANDROID_SDK_ROOT" ./build-archlinux.sh all

      - name: Locate built APK
        id: apk
        run: |
          set -e
          APK=$(find apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK found"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -la apk/
          echo "--- APK size ---"
          du -h "$APK"

      - name: Upload build artifact (90-day)
        uses: actions/upload-artifact@v4
        with:
          name: LeicaPerfect-v6.6.2-debug-apk
          path: apk/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Split APK into ~36MB fragments + checksums + 7z supercompress
        run: |
          set -e
          cd apk
          APK=$(find . -name '*.apk' -type f | head -1)
          APK_BASE=$(basename "$APK")
          echo "=== Splitting $APK_BASE into ~36MB fragments ==="
          split -b 36m -a 1 "$APK" "${APK_BASE}.part"
          ls -la "${APK_BASE}".part*
          echo "--- sha256 of fragments ---"
          sha256sum "${APK_BASE}".part* | tee fragments.sha256
          echo "--- full apk sha256 ---"
          sha256sum "$APK" | tee apk.sha256
          echo "--- copy static reassemble.sh from repo root ---"
          cp ../reassemble.sh ./reassemble.sh
          chmod +x reassemble.sh
          echo "=== 7z supercompress (LZMA2 max) ==="
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -ms=on "${APK_BASE}.7z" "$APK"
          ls -la "${APK_BASE}.7z"
          echo "--- 7z sha256 ---"
          sha256sum "${APK_BASE}.7z" | tee 7z.sha256
          echo "--- compression ratio ---"
          APK_SIZE=$(stat -c %s "$APK")
          SEVENZ_SIZE=$(stat -c %s "${APK_BASE}.7z")
          echo "APK: $APK_SIZE bytes ($(($APK_SIZE / 1024 / 1024)) MB)"
          echo "7z:  $SEVENZ_SIZE bytes ($(($SEVENZ_SIZE / 1024 / 1024)) MB)"
          echo "ratio: $(echo "scale=1; $SEVENZ_SIZE * 100 / $APK_SIZE" | bc)%"
          ls -la

      - name: "Create / update rolling Release (tag: latest)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Leica Perfect v6.6.2 ABSOLUTE (Round 11 None mode perfection — warmer + contrast + skin sat + sharp)"
          body: |
            # Leica Perfect v6.6.2 ABSOLUTE

            Photon Camera fork — built from upstream `bjzhou/PhotonCamera` 1.26.1
            + surgical patches + **v6.5 VLM-driven pipeline fixes** + **v6.5.3 Round 08 polish tuning** + **v6.6.0 Round 09 hardware-aware pipeline fixes** + **v6.6.1 Round 10 daylight regression fix** + **v6.6.2 Round 11 None mode perfection**.

            ## ABSOLUTE build
            - **No mod menu** — mode_max is baked from JSON config (no UI to change it)
            - ccache enabled for faster native builds
            - **Capture mode: `mode_max`** (default) — `mode_night` available in JSON for night tripod shots
            - 15/9/7/11 frames, super-res 2.0x, NLM radius 7, JPEG/HEIC/UltraHDR Q100
            - Optimized for **Xiaomi 15T** (OV50E + S5KJN1 + S5K3J1 + OV32B)
            - **JPEG by default; RAW available on-demand** via gear icon → RAW toggle (v6.4.5)
            - **v6.4.7-fix2: DEBUG build** — reverted from release to debug build for guaranteed installability

            ## What's new in v6.6.2 (Round 11 None mode perfection)

            ### v6.6.2 — Round 11 NONE MODE PERFECTION

            VLM 3-way selfie comparison (None vs Standard vs Stock) revealed None mode was flat/cool/soft
            vs Standard profile which adds warmth+contrast+skin sat+sharpening. v6.6.1 warmth 1.12 was
            insufficient. Bridge 2-none analysis showed AE/AWB hunting between shots 15s apart.

            **Fix (config-only, zero build risk):**

            - **More warmth**: `warmth` 1.12→1.18 (+5%, total +12% from v6.5.3 — kill cyan for good)
            - **S-curve contrast**: `contrast` 1.08→1.15 (+6%, match Standard profile pop)
            - **Skin tone boost**: `saturation_red` 1.05→1.15 (+10%, VLM: "Standard boosts orange/red +10-20")
            - **More sharpening**: `amount` 0.030→0.045 (+50%, match Standard sharpness)
            - **AE consistency**: `max_ev_comp_steps` 12→8 (-33%, faster AE lock = less hunting)
            - **Better highlights**: `highlight_clip_threshold` 0.2→0.15, `gamma_shoulder` 0.45→0.50
            - **per_lens.main**: 11 params tuned (ev_comp -0.05, gamma_contrast 1.10, sharp_mult 0.38, tint -15)

            All v6.5.x + v6.6.0 + v6.6.1 fixes preserved.

            ### v6.6.1 (Round 10 daylight regression fix)

            ### v6.6.1 — Round 10 DAYLIGHT REGRESSION FIX

            VLM pair comparison (Photon vs Xiaomi stock camera) scored Photon 3/10 vs Stock 8/10.
            5 critical defects found in daylight scenes:

            1. **Cool cyan-blue cast** — warmth 1.05 was insufficient for bright sun
            2. **Blown highlights** — sky completely white, lost all cloud detail
            3. **Watercolor effect** — luma NR 98.5% was extreme, smeared fine texture
            4. **Soft detail + halos** — edge-only sharpening produced mushy + haloed look
            5. **Corner darkening + magenta** — P-80 Software LSC had inverted vignette formula

            **Fix (18 config params across 7 sections, config-only — zero build risk):**

            - **P-80 DISABLED**: `vignette_correction_strength` 0.5→0.0 (shader formula also fixed: `1.0 -` → `1.0 +`)
            - **Warmer WB**: `warmth` 1.05→1.12 (+7%), `vibrance` 1.06→1.10, `saturation_boost` 1.0→1.03
            - **Kill watercolor**: `luminance` NR 0.985→0.94, `detail_preserve` 0.85→0.93
            - **Less halos**: `sharpening.amount` 0.040→0.030, `edge_mask_strength` 4.5→3.0
            - **Save clouds**: `highlight_clip_threshold_pct` 0.5→0.2, `highlight_rolloff` 0.22→0.18
            - **Better HDR**: `long_frame_exposure_ev` 2.8→3.2, `short_frame_exposure_divisor` 2.5→3.0
            - **per_lens.main**: 11 params (`ev_comp` 0.15→0.0, `gamma_shoulder` 0.35→0.45, `saturation_red` 0.93→1.05, `saturation_blue` 1.0→0.88 — counter cyan)

            All v6.5.x + v6.6.0 fixes preserved (force_dcp_id=null, awb_clamp=false, multi_frame ON, P-81 QuadBayer, P-83 night mode, P-84 ZSL).

            ### v6.6.0 (Round 09 hardware-aware — 4 new patches)
            Goal: make Photon surpass stock in ALL scenarios, not just 80%.

            ### P-80: Software LSC radial correction (kill residual color vignette)
            - **Problem**: Hardware LSC (SHADING_MODE_HIGH_QUALITY) leaves residual color vignette — visible as green/magenta casts at frame edges in dark scenes on QuadBayer sensors (OV50E)
            - **Fix**: New `SoftwareLscShader.kt` (GLSL compute shader) applies radial vignette + per-channel tint correction post-demosaic
            - **5 new config params**: `lens_correction.vignette_correction_strength` (0.5), `vignette_correction_radius` (0.7), `vignette_correction_tint_red/green/blue` (0.0/-0.05/0.0)
            - Wired via `RawDemosaicProcessor.applySoftwareLscIfNeeded()` — opt-in via `lens_correction.vignette_correction=true` (already true in v6.5.x)

            ### P-81: QuadBayer remosaic detection (fix 50% resolution loss on OV50E!)
            - **ROOT CAUSE**: `RawMetadata.kt` `when(correctedCfa)` only mapped 4 standard Bayer patterns (RGGB/GRBG/GBRG/BGGR). QuadBayer sensors (Android 13+ constants 4..7) fell to `else -> CFA_RGGB` → `isQuadBayer()=false` → QuadBayer demosaic path (`QuadBayerShaders.kt` with 5 compute shaders POPULATE/GREEN/CHROMA/REFINE/WRITE_OUTPUT) NEVER invoked → **50% resolution loss on main camera**
            - **Fix**: Added 4 new cases before `else` branch: `4 -> CFA_QUAD_RGGB`, `5 -> CFA_QUAD_GRBG`, `6 -> CFA_QUAD_GBRG`, `7 -> CFA_QUAD_BGGR`
            - **Manual override**: `sensors.force_quad_bayer_remosaic` (default false) — set true if HAL misreports CFA
            - **Expected impact**: +30-50% real resolution on OV50E main camera

            ### P-83: Night mode dedicated (1-3s long exposure + multi-frame stacking)
            - **Problem**: `MultiFrameConfig.LONG_FRAME_MAX_EXPOSURE_TIME_NS = 10_000_000L` (10ms) hard cap — fine for hand-held daytime, useless for night tripod shots
            - **Fix**: New `mode_night` capture mode with `long_exposure_time_ms: 2000` (2s) + `multi_frame_stack_count: 5`. `MultiFrameConfig.LONG_FRAME_MAX_EXPOSURE_TIME_NS` changed from `const val` to `val get() = LeicaConfig.nightModeLongExposureMaxNs` (dynamic: 10ms mode_max, 2000ms mode_night)
            - **5 new accessors**: `isNightMode`, `nightModeLongExposureMs`, `nightModeStackCount`, `nightModeForceLongExposure`, `nightModeLongExposureMaxNs`

            ### P-84: ZSL circular buffer (zero shutter lag — 5-frame ring)
            - **Problem**: `Camera2Controller.kt:3121` forcibly set `CONTROL_ENABLE_ZSL=false` → no ZSL → shutter lag ~2s (15-frame capture)
            - **Fix**: New `ZslBufferManager.kt` (5-frame ring buffer of TotalCaptureResults, 500ms max age). `Camera2Controller.setZslDisabledIfSupported()` now respects `LeicaConfig.zslBufferEnabled` — when true, enables ZSL + populates buffer
            - **Config**: `capture_modes.modes.mode_max.zsl_buffer_enabled` (default false — opt-in) + `zsl_buffer_size` (5)
            - **Note**: Currently only enables ZSL hardware feature + populates buffer. Full zero-lag capture trigger (pull from buffer instead of new capture) is reserved for v6.6.1 after validating buffer population

            ## v6.5.3 (previous) — Round 08 polish tuning (24 params)
            Based on VLM comparative analysis of 6 beach photos. Eliminates residual ciano/green tint, restores natural green/blue saturation, kills halos and oil-painting, protects highlights/shadows.

            ## v6.5.2 — ROOT CAUSE FIX: green cast in PREVIEW
            - `awb_clamp.enabled: true → false` (U-05 was bypassing HAL with manual TRANSFORM_MATRIX → green cast)

            ## v6.5.1 — ROOT CAUSE FIX: universal green cast + single-frame noise
            - DCP CCD Leica M8 REMOVIDO (force_dcp_id=null) — CCM nativa do sensor OV50E CMOS QuadBayer
            - LUT CCD Leica M9 REMOVIDO (force_baseline_lut_id=null) — AgX tone mapping nativo
            - force_rawmax mode_max false→true (multi-frame stacking re-enabled)

            ## v6.5.0 — VLM-driven pipeline fixes (U-01..U-06)
            Based on 5 rounds of comparative testing (PhotonCamera vs native camera + M9 CCD evaluation):
            - **4 rounds: native camera won 4×0** (AWB instability, oversharpening, HDR halos, oil-painting)
            - **1 round: M9 CCD 75% success** (stable AWB but pipeline base issues persist)
            - **Root cause: 2-layer diagnosis** — pipeline base problems (all profiles) + default mode problems (profiles can mitigate)

            ### U-01: Denoise Shadows Reinforcement (P0)
            - **Problem**: Shadow regions had insufficient denoise → visible noise in dark areas
            - **Fix**: NLM shadow-band boost (shadowMask multiplier on uDenoiseMix), per-lens 4-coef noise model (a/b/c/d), config-driven SEARCH_RADIUS
            - **Config**: `noise_reduction.shadow_band_boost = 0.5` (NEW field)

            ### U-02: Adaptive Sharpening (P0)
            - **Problem**: Global oversharpening — unsharp mask applied uniformly, amplifying noise
            - **Fix**: -40% amount (0.09→0.054), edge mask (Sobel 4-tap), noise gating (CalcNoise), brightness-adaptive amount (CalcAmount), config-driven radius/threshold
            - **Config**: `sharpening.amount 0.09→0.054`, `edge_mask_strength 2.2→3.5`, `adaptive: true` (NEW)
            - **Bug fix**: {N;s} → {N;N;s} multi-line sed bug fixed (4 adaptive uniforms now properly bound)

            ### U-03: Bilateral → Guided Filter (P0)
            - **Problem**: HDR halos — bilateral filter in ShadowsHighlightsShader produces high-contrast edge halos
            - **Fix**: He et al. 2010 guided filter (single-window approximation, 5×5 grid, 25 taps) replaces bilateral range kernel. Halo-resistant by design (coefficient a bounded [0,1])
            - **Config**: `tone_mapping.guided_filter_enabled = true` (NEW), `guided_filter_radius = 10.0`, `guided_filter_eps = 0.01`
            - **shadow_lift 0.05→0.03** (-40% — less shadow noise), **highlight_rolloff 0.35→0.30** (-14%)

            ### U-04: Detail Preserve Wiring (P1)
            - **Problem**: Oil-painting effect — low-texture regions over-smoothed (detail_preserve was dead config, centralPixelWeight hardcoded 0.1)
            - **Fix**: Wire detail_preserve to uDetailPreserve shader uniform (caps coarseMix), config-driven centralPixelWeight (0.1→0.75), COARSE_GUIDE_WEIGHT getter (8.0→5.0 at detail_preserve=0.75)
            - **Config**: `noise_reduction.detail_preserve 0.85→0.75` (-12%)

            ### U-05: AWB CCT Clamping (P0)
            - **Problem**: AWB instability — default AUTO mode oscillates between cold/blue and warm/yellow across frames
            - **Fix**: Import M9 CCD CCT clamping logic to default mode. Route AUTO through MANUAL TRANSFORM_MATRIX with EMA-smoothed CCT clamped to [3500K, 7000K]. New WhiteBalanceControlPath.CLAMPED_AUTO enum.
            - **Config**: `awb_clamp.enabled = true` (NEW section), `min_cct = 3500`, `max_cct = 7000`, `smoothing_alpha = 0.15`

            ### U-06: AE Histogram Feedback (P1)
            - **Problem**: AE instability — overexposure (highlight blow-outs) and underexposure (crushed blacks) in challenging scenes
            - **Fix**: New AeHistogramProtector.kt computes per-frame clip fractions, applies EV compensation correction (-6 to +6 steps). 3 AE-comp sites wired (applyExposureSettings, calculateHdrBracketExposureCompensation, HDR bracket). pgtm_pre_tonemap_exposure_boost_ev gated by shadow clip.
            - **Config**: `ae_protection.enabled = true` (NEW section), `highlight_clip_threshold_pct = 1.0`, `shadow_clip_threshold_pct = 1.0`, `histogram_feedback_enabled = true`
            - **processing.default_exposure_ev 0.88→0.5** (-43%), **pgtm_pre_tonemap_exposure_boost_ev 0.8→0.4** (-50%)

            ### Config tuning summary (v6.5)
            | Parameter | Before | After | Change |
            |-----------|--------|-------|--------|
            | sharpening.amount | 0.09 | 0.054 | -40% |
            | sharpening.edge_mask_strength | 2.2 | 3.5 | +59% |
            | noise_reduction.chrominance | 0.94 | 0.96 | +2% |
            | noise_reduction.detail_preserve | 0.85 | 0.75 | -12% |
            | color.saturation_boost | 1.02 | 1.0 | neutral |
            | color.vibrance | 1.01 | 1.04 | +3% |
            | tone_mapping.shadow_lift | 0.05 | 0.03 | -40% |
            | tone_mapping.highlight_rolloff | 0.35 | 0.30 | -14% |
            | processing.default_exposure_ev | 0.88 | 0.5 | -43% |
            | processing.pgtm_pre_tonemap_exposure_boost_ev | 0.8 | 0.4 | -50% |

            ## Previous versions
            - **v6.4.10**: P-78 WIRE NR TO ALGORITHM (P-77 was dead config — GalleryManager rawChromaNoiseReduction/rawNoiseReduction wired to LeicaConfig, sharpening 0.4→0.15)
            - **v6.4.9**: P-77 REAL night denoise (chroma NR JSON values — but dead config, fixed by P-78)
            - **v6.4.8**: P-76 night precision (revert P-75 LUT leica_m9 + AgX softer + NR luma up)
            - **v6.4.7**: P-75 natural baseline + latent bug fix
            - **v6.4.6**: P-73 mode_fast removed + P-74 Release APK + R8
            - **v6.4.5**: P-72 RAW on-demand + P-71 composition aids + P-69 photo quality

            ## Download
            ### Option A — single APK (easiest)
            Download `LeicaPerfect-v6.6.2-debug.apk` and install.

            ### Option B — 7z supercompressed (smallest download)
            Download `LeicaPerfect-v6.6.2-debug.apk.7z` (LZMA2 max compression).
            Extract with: `7z x LeicaPerfect-v6.6.2-debug.apk.7z`

            ### Option C — fragments (parallel / resumable)
            Grab the `.part*` files + `reassemble.sh` + `fragments.sha256` and run `bash reassemble.sh`.

            ---
            Build commit: ${{ github.sha }}
            Built at: ${{ github.run_id }}
          files: |
            apk/*.apk
            apk/*.apk.part*
            apk/*.apk.7z
            apk/reassemble.sh
            apk/apk.sha256
            apk/fragments.sha256
            apk/7z.sha256
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            /tmp/photon_upstream/**/*.log
            /tmp/leica_build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
