name: Build & Release APK

# Builds the Photon Camera fork (Leica Perfect v6.4.4 ABSOLUTE) from upstream
# bjzhou/PhotonCamera 1.26.1 + surgical patches, then publishes the APK as a rolling
# GitHub Release (tag "latest") for fast CDN-backed download.
#
# ABSOLUTE build: NO_MENU=1 (no mod menu UI — mode_max baked from JSON config).
# ccache enabled for faster native C/C++ recompilation.
# APK + fragments + 7z supercompressed archive published to the `latest` release.
#
# Rolling `latest` release URL (always the newest green build):
#   https://github.com/Chrispsz/photon-camera-leica-perfect/releases/download/latest/LeicaPerfect-v6.4.4-debug.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      NO_MENU: "1"
    steps:
      - name: Checkout fork (patches + config + build script)
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components + ccache + p7zip
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache p7zip-full
          ccache --version | head -1
          7z | head -2
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          echo "--- installed NDKs ---"
          ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-ndk27-${{ hashFiles('patches/*.kt', 'build-archlinux.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-ndk27-

      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NO_MENU=$NO_MENU"
          java -version
          ccache --version | head -1
          git --version
          nproc
          free -h

      - name: Build (clone upstream + patch + gradle assembleDefaultDebug)
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 2G 2>/dev/null || true
          chmod +x build-archlinux.sh
          ANDROID_HOME="$ANDROID_SDK_ROOT" ./build-archlinux.sh all

      - name: Locate built APK
        id: apk
        run: |
          set -e
          APK=$(find apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK found"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -la apk/
          echo "--- APK size ---"
          du -h "$APK"

      - name: Upload build artifact (90-day)
        uses: actions/upload-artifact@v4
        with:
          name: LeicaPerfect-v6.4.4-debug-apk
          path: apk/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Split APK into ~36MB fragments + checksums + 7z supercompress
        run: |
          set -e
          cd apk
          APK=$(find . -name '*.apk' -type f | head -1)
          APK_BASE=$(basename "$APK")
          echo "=== Splitting $APK_BASE into ~36MB fragments ==="
          split -b 36m -a 1 "$APK" "${APK_BASE}.part"
          ls -la "${APK_BASE}".part*
          echo "--- sha256 of fragments ---"
          sha256sum "${APK_BASE}".part* | tee fragments.sha256
          echo "--- full apk sha256 ---"
          sha256sum "$APK" | tee apk.sha256
          echo "--- copy static reassemble.sh from repo root ---"
          cp ../reassemble.sh ./reassemble.sh
          chmod +x reassemble.sh
          echo "=== 7z supercompress (LZMA2 max) ==="
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -ms=on "${APK_BASE}.7z" "$APK"
          ls -la "${APK_BASE}.7z"
          echo "--- 7z sha256 ---"
          sha256sum "${APK_BASE}.7z" | tee 7z.sha256
          echo "--- compression ratio ---"
          APK_SIZE=$(stat -c %s "$APK")
          SEVENZ_SIZE=$(stat -c %s "${APK_BASE}.7z")
          echo "APK: $APK_SIZE bytes ($(($APK_SIZE / 1024 / 1024)) MB)"
          echo "7z:  $SEVENZ_SIZE bytes ($(($SEVENZ_SIZE / 1024 / 1024)) MB)"
          echo "ratio: $(echo "scale=1; $SEVENZ_SIZE * 100 / $APK_SIZE" | bc)%"
          ls -la

      - name: "Create / update rolling Release (tag: latest)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Leica Perfect v6.4.4 ABSOLUTE (mode_max)
          body: |
            # Leica Perfect v6.4.4 ABSOLUTE

            Photon Camera fork — built from upstream `bjzhou/PhotonCamera` 1.26.1
            + surgical patches (Cron 13 composition aids + photo quality + video 4K stability).

            ## ABSOLUTE build
            - **No mod menu** — mode_max is baked from JSON config (no UI to change it)
            - ccache enabled for faster native builds
            - **Capture mode: `mode_max`** (15/9/7/11 frames, super-res 2.0x, NLM radius 7, JPEG/HEIC/UltraHDR Q100)
            - Optimized for **Xiaomi 15T** (OV50E + S5KJN1 + S5K3J1 + OV32B)
            - RAW/DNG export disabled (JPEG one-click)

            ## What's new in v6.4.4
            - **P-71 composition aids ON**: grid (rule-of-thirds) + horizon level + DNG-with-RAW export — all ON by default
            - **P-69 photo quality**: NR Off, Sharpening HQ, JPEG Q100 4:4:4, P010 10-bit, JPGmax HDR
            - **P-70 video 4K stability**: bitrate 250→120 Mbps, muxer.stop() error propagation
            - ⚠️ **Clear Data** after install (Android Settings → Apps → Photon Camera) to apply P-69/P-71 defaults

            ## Download
            ### Option A — single APK (easiest)
            Download `LeicaPerfect-v6.4.4-debug.apk` and install.

            ### Option B — 7z supercompressed (smallest download)
            Download `LeicaPerfect-v6.4.4-debug.apk.7z` (LZMA2 max compression, ~40% smaller).
            Extract with: `7z x LeicaPerfect-v6.4.4-debug.apk.7z`

            ### Option C — fragments (parallel / resumable)
            Grab the 4 `.part*` files + `reassemble.sh` + `fragments.sha256` and run `bash reassemble.sh`.

            ---
            Build commit: ${{ github.sha }}
            Built at: ${{ github.run_id }}
          files: |
            apk/*.apk
            apk/*.apk.part*
            apk/*.apk.7z
            apk/reassemble.sh
            apk/apk.sha256
            apk/fragments.sha256
            apk/7z.sha256
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            /tmp/photon_upstream/**/*.log
            /tmp/leica_build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
