name: Build & Release APK

# Builds the Photon Camera fork (Leica Perfect v6.4.10 ABSOLUTE) from upstream
# bjzhou/PhotonCamera 1.26.1 + surgical patches, then publishes the APK as a rolling
# GitHub Release (tag "latest") for fast CDN-backed download.
#
# ABSOLUTE build: NO_MENU=1 (no mod menu UI — mode_max baked from JSON config).
# ccache enabled for faster native C/C++ recompilation.
# v6.4.6: Release build (R8 + arm64-v8a only — ~50% smaller APK).
# v6.4.7: Natural baseline (LUT "none" no perfil ativo + fix latent force_baseline_lut_id).
# v6.4.8: Night precision (revert P-75 LUT leica_m9 + AgX softer + NR luma up — flat+noisy fix).
# v6.4.9: REAL night denoise (dead config — fixed by P-78 in v6.4.10) (chroma NR 0.7→0.94 + detail_preserve 0.96→0.85 + exposure reduction — VLM-flagged chroma noise fix).
# APK + fragments + 7z supercompressed archive published to the `latest` release.
#
# Rolling `latest` release URL (always the newest green build):
#   https://github.com/Chrispsz/photon-camera-leica-perfect/releases/download/latest/LeicaPerfect-v6.4.10-debug.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      NO_MENU: "1"
    steps:
      - name: Checkout fork (patches + config + build script)
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components + ccache + p7zip
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache p7zip-full
          ccache --version | head -1
          7z | head -2
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          echo "--- installed NDKs ---"
          ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-ndk27-${{ hashFiles('patches/*.kt', 'build-archlinux.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-ndk27-

      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NO_MENU=$NO_MENU"
          java -version
          ccache --version | head -1
          git --version
          nproc
          free -h

      - name: Build (clone upstream + patch + gradle assembleDefaultDebug — v6.4.10)
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 2G 2>/dev/null || true
          chmod +x build-archlinux.sh
          ANDROID_HOME="$ANDROID_SDK_ROOT" ./build-archlinux.sh all

      - name: Locate built APK
        id: apk
        run: |
          set -e
          APK=$(find apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK found"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -la apk/
          echo "--- APK size ---"
          du -h "$APK"

      - name: Upload build artifact (90-day)
        uses: actions/upload-artifact@v4
        with:
          name: LeicaPerfect-v6.4.10-debug-apk
          path: apk/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Split APK into ~36MB fragments + checksums + 7z supercompress
        run: |
          set -e
          cd apk
          APK=$(find . -name '*.apk' -type f | head -1)
          APK_BASE=$(basename "$APK")
          echo "=== Splitting $APK_BASE into ~36MB fragments ==="
          split -b 36m -a 1 "$APK" "${APK_BASE}.part"
          ls -la "${APK_BASE}".part*
          echo "--- sha256 of fragments ---"
          sha256sum "${APK_BASE}".part* | tee fragments.sha256
          echo "--- full apk sha256 ---"
          sha256sum "$APK" | tee apk.sha256
          echo "--- copy static reassemble.sh from repo root ---"
          cp ../reassemble.sh ./reassemble.sh
          chmod +x reassemble.sh
          echo "=== 7z supercompress (LZMA2 max) ==="
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -ms=on "${APK_BASE}.7z" "$APK"
          ls -la "${APK_BASE}.7z"
          echo "--- 7z sha256 ---"
          sha256sum "${APK_BASE}.7z" | tee 7z.sha256
          echo "--- compression ratio ---"
          APK_SIZE=$(stat -c %s "$APK")
          SEVENZ_SIZE=$(stat -c %s "${APK_BASE}.7z")
          echo "APK: $APK_SIZE bytes ($(($APK_SIZE / 1024 / 1024)) MB)"
          echo "7z:  $SEVENZ_SIZE bytes ($(($SEVENZ_SIZE / 1024 / 1024)) MB)"
          echo "ratio: $(echo "scale=1; $SEVENZ_SIZE * 100 / $APK_SIZE" | bc)%"
          ls -la

      - name: "Create / update rolling Release (tag: latest)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Leica Perfect v6.4.10 ABSOLUTE (mode_max — Leica M9 LUT — NR WIRED TO ALGORITHM — DEBUG build)
          body: |
            # Leica Perfect v6.4.10 ABSOLUTE

            Photon Camera fork — built from upstream `bjzhou/PhotonCamera` 1.26.1
            + surgical patches (Cron 19: WIRE NR TO ACTUAL ALGORITHM — P-77 was dead config!).

            ## ABSOLUTE build
            - **No mod menu** — mode_max is baked from JSON config (no UI to change it)
            - ccache enabled for faster native builds
            - **Capture mode: `mode_max`** (ONLY mode — mode_fast removed in v6.4.6)
            - 15/9/7/11 frames, super-res 2.0x, NLM radius 7, JPEG/HEIC/UltraHDR Q100
            - Optimized for **Xiaomi 15T** (OV50E + S5KJN1 + S5K3J1 + OV32B)
            - **JPEG by default; RAW available on-demand** via gear icon → RAW toggle (v6.4.5)
            - **v6.4.6: Release build** — R8 minified + arm64-v8a only (~50% smaller APK)
            - **v6.4.7: Natural baseline** — LUT "none" no perfil ativo (DCP Leica M8 + AgX + sharpening)
            - **v6.4.7-fix2: DEBUG build** — reverted from release to debug build for guaranteed installability (release build had "parse error" on Xiaomi 15T)
            - **v6.4.8: Night precision** — revert P-75 LUT leica_m9 + AgX softer + NR luma up
            - **v6.4.9: REAL night denoise (dead config — fixed by P-78)** — chroma NR JSON values set but were DEAD CONFIG (never called by code). Exposure reduction (P-77.4-6) made photos too dark → REVERTED in P-78.1-3.

            ## What's new in v6.4.10 (P-78 WIRE NR TO ALGORITHM)
            - **CRITICAL BUG DISCOVERY**: VLM analysis of v6.4.9 photos showed P-77 had NO EFFECT on noise.
            - **Root cause**: `noise_reduction.luminance/chrominance/detail_preserve` in leica_perfect.json are DEFINED in LeicaConfig.kt (accessors exist) but NEVER CALLED by any code!
            - **The ACTUAL NR strength** comes from:
              - `GalleryManager.kt:244` — `rawNoiseReduction = preferences?.rawNlmNoiseFactor ?: 0f` (luma NR defaults to **0 = OFF**)
              - `GalleryManager.kt:245` — `rawChromaNoiseReduction = 0f` (**HARDCODED ZERO** — chroma NR always OFF!)
              - `RawSharpeningDefaults.kt:4` — `CAPTURE_DEFAULT = 0.4f` (sharpening ON — **amplifies noise**!)
            - **Result**: ALL night photos since v6.2.0 had luma NR OFF + chroma NR OFF + sharpening amplifying noise. P-77.1/2/3 JSON values (chrominance=0.94, luminance=0.98) were dead config.
            - **P-77.4/5/6 exposure reductions** (shadow_lift, default_exposure, pgtm_boost) DID work but made photos -46% darker WITHOUT reducing noise = worst of both worlds.
            - **P-78 FIX (6 sub-patches)**:
              - **P-78.1**: REVERT `shadow_lift 0.02→0.05` (undo P-77.4 — was too dark)
              - **P-78.2**: REVERT `default_exposure_ev 0.5→0.88` (undo P-77.5 — was too dark)
              - **P-78.3**: REVERT `pgtm_pre_tonemap_exposure_boost_ev 0.4→0.8` (undo P-77.6 — was too dark)
              - **P-78.4**: sed `GalleryManager.kt:244` — wire luma NR to `LeicaConfig.noiseReductionLuminance.toFloat()` (was `0f` = OFF!)
              - **P-78.5**: sed `GalleryManager.kt:245` — wire chroma NR to `LeicaConfig.noiseReductionChrominance.toFloat()` (was **HARDCODED `0f`** = OFF!)
              - **P-78.6**: sed `RawSharpeningDefaults.kt:4` — `CAPTURE_DEFAULT 0.4f→0.15f` (reduce noise amplification)
            - **Now the JSON config values ACTUALLY affect image processing**: chrominance=0.94 + luminance=0.98 are finally read by the NR algorithm.
            - **Sharpening reduced 63%** (0.4→0.15) stops amplifying the noise that was previously invisible to the (dead) NR config.

            ## What's new in v6.4.9 (previous — P-77 REAL night denoise, dead config fixed by P-78)
            - **User feedback (v6.4.8)**: "Muito ruído ainda, principalmente nas pessoas"
            - **VLM analysis of 2 night photos** (ISO 2127 + ISO 1281, taken on Xiaomi 15T):
              - "Chroma Noise is the dominant offender" — red/green/blue specks on walls + faces
              - "Aggressive Luminance lifting without sufficient NR" — +1.68 EV total boost amplified ISO 1281-2127 noise ~5x
              - "Smeared AND Noisy" on people — worst of both worlds (NR too weak + sharpening noise)
            - **Root cause**: P-76 (v6.4.8) boosted `luminance` NR 0.92→0.96 but **completely missed** `chrominance` (still 0.7 = weak default) and `detail_preserve` (still 0.96 = preserves noise as detail)
            - **P-77.1: noise_reduction.chrominance 0.7→0.94** (+34% chroma NR — kills red/green/blue specks VLM flagged as dominant offender)
            - **P-77.2: noise_reduction.luminance 0.96→0.98** (+2% more luma NR for ISO 1281-2127 night noise)
            - **P-77.3: noise_reduction.detail_preserve 0.96→0.85** (-11% — allows NR to actually smooth noise instead of preserving it as fake detail)
            - **P-77.4: tone_mapping.shadow_lift 0.05→0.02** (-60% — shadows stay dark = less noise visible in dark areas VLM flagged)
            - **P-77.5: processing.default_exposure_ev 0.88→0.5** (-43% — less aggressive default exposure lift = less noise amplification)
            - **P-77.6: processing.pgtm_pre_tonemap_exposure_boost_ev 0.8→0.4** (-50% — total exposure lift now +0.9 EV instead of +1.68 EV = -46% noise amplification)

            ## What's new in v6.4.8 (previous — P-76 night precision)
            - **P-76.1: revert LUT leica_m9** — P-75 (v6.4.7) set lut_id="none" which removed Leica M9 CCD color science.
            - **P-76.2: force_baseline_lut_id="leica_m9"** — case-sensitive correct ID (latent bug stays FIXED).
            - **P-76.3: AgX shadow_lift 0.10→0.05** — -50% shadow lift. (P-77.4 lowered further to 0.02.)
            - **P-76.4: pgtm_pre_tonemap_exposure_boost_ev 1.3→0.8** — -38% pre-tonemap boost. (P-77.6 lowered further to 0.4.)
            - **P-76.5: noise_reduction.luminance 0.92→0.96** — +4% luma NR. (P-77.2 raised further to 0.98.)
            - **⚠️ P-76 was incomplete** — missed chrominance (still 0.7) + detail_preserve (still 0.96). P-77 fixes this.

            ## What's new in v6.4.7 (older — P-75, partially reverted by P-76/P-77)
            - **P-75 natural baseline (LUT none)**: removed Leica M9 CCD color science for "natural" look.
              REVERTED in v6.4.8 P-76.1 — flat+noisy at night.
            - **P-75 latent bug fix**: force_baseline_lut_id "Leica_M9_STD"→"none"→"leica_m9" (v6.4.8).
              Bug STAYS FIXED with correct case-sensitive ID.

            ## What's new in v6.4.6 (older)
            - **P-73 mode_fast removed**: single capture mode (mode_max only). Thermal throttle is warning-only.
            - **P-74 Release APK + R8**: switched from debug to release build. R8 + arm64-v8a (~50% smaller APK).
            - **v6.4.7-fix2**: reverted to DEBUG build (release had "parse error" on Xiaomi 15T).

            ## What's new in v6.4.5 (older)
            - **P-72 RAW on-demand**: flipped `force_no_raw`/`force_no_dng` true→false
            - **P-71 composition aids ON**: grid + horizon level + DNG-with-RAW export
            - **P-69 photo quality**: NR Off, Sharpening HQ, JPEG Q100 4:4:4, P010 10-bit
            - **P-70 video 4K stability**: bitrate 250→120 Mbps, muxer.stop() fix
            - ⚠️ **Clear Data** after install (Android Settings → Apps → Photon Camera) to apply P-69/P-71 defaults

            ## Download
            ### Option A — single APK (easiest)
            Download `LeicaPerfect-v6.4.10-debug.apk` and install.

            ### Option B — 7z supercompressed (smallest download)
            Download `LeicaPerfect-v6.4.10-debug.apk.7z` (LZMA2 max compression).
            Extract with: `7z x LeicaPerfect-v6.4.10-debug.apk.7z`

            ### Option C — fragments (parallel / resumable)
            Grab the `.part*` files + `reassemble.sh` + `fragments.sha256` and run `bash reassemble.sh`.

            ---
            Build commit: ${{ github.sha }}
            Built at: ${{ github.run_id }}
          files: |
            apk/*.apk
            apk/*.apk.part*
            apk/*.apk.7z
            apk/reassemble.sh
            apk/apk.sha256
            apk/fragments.sha256
            apk/7z.sha256
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            /tmp/photon_upstream/**/*.log
            /tmp/leica_build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
