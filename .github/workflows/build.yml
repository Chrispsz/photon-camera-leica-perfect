name: Build & Release APK

# Builds the Photon Camera fork (Leica Perfect v6.4.8 ABSOLUTE) from upstream
# bjzhou/PhotonCamera 1.26.1 + surgical patches, then publishes the APK as a rolling
# GitHub Release (tag "latest") for fast CDN-backed download.
#
# ABSOLUTE build: NO_MENU=1 (no mod menu UI — mode_max baked from JSON config).
# ccache enabled for faster native C/C++ recompilation.
# v6.4.6: Release build (R8 + arm64-v8a only — ~50% smaller APK).
# v6.4.7: Natural baseline (LUT "none" no perfil ativo + fix latent force_baseline_lut_id).
# v6.4.8: Night precision (revert P-75 LUT leica_m9 + AgX softer + NR luma up — flat+noisy fix).
# APK + fragments + 7z supercompressed archive published to the `latest` release.
#
# Rolling `latest` release URL (always the newest green build):
#   https://github.com/Chrispsz/photon-camera-leica-perfect/releases/download/latest/LeicaPerfect-v6.4.8-debug.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      NO_MENU: "1"
    steps:
      - name: Checkout fork (patches + config + build script)
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components + ccache + p7zip
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache p7zip-full
          ccache --version | head -1
          7z | head -2
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          echo "--- installed NDKs ---"
          ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-ndk27-${{ hashFiles('patches/*.kt', 'build-archlinux.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-ndk27-

      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NO_MENU=$NO_MENU"
          java -version
          ccache --version | head -1
          git --version
          nproc
          free -h

      - name: Build (clone upstream + patch + gradle assembleDefaultDebug — v6.4.8)
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 2G 2>/dev/null || true
          chmod +x build-archlinux.sh
          ANDROID_HOME="$ANDROID_SDK_ROOT" ./build-archlinux.sh all

      - name: Locate built APK
        id: apk
        run: |
          set -e
          APK=$(find apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK found"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -la apk/
          echo "--- APK size ---"
          du -h "$APK"

      - name: Upload build artifact (90-day)
        uses: actions/upload-artifact@v4
        with:
          name: LeicaPerfect-v6.4.8-debug-apk
          path: apk/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Split APK into ~36MB fragments + checksums + 7z supercompress
        run: |
          set -e
          cd apk
          APK=$(find . -name '*.apk' -type f | head -1)
          APK_BASE=$(basename "$APK")
          echo "=== Splitting $APK_BASE into ~36MB fragments ==="
          split -b 36m -a 1 "$APK" "${APK_BASE}.part"
          ls -la "${APK_BASE}".part*
          echo "--- sha256 of fragments ---"
          sha256sum "${APK_BASE}".part* | tee fragments.sha256
          echo "--- full apk sha256 ---"
          sha256sum "$APK" | tee apk.sha256
          echo "--- copy static reassemble.sh from repo root ---"
          cp ../reassemble.sh ./reassemble.sh
          chmod +x reassemble.sh
          echo "=== 7z supercompress (LZMA2 max) ==="
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -ms=on "${APK_BASE}.7z" "$APK"
          ls -la "${APK_BASE}.7z"
          echo "--- 7z sha256 ---"
          sha256sum "${APK_BASE}.7z" | tee 7z.sha256
          echo "--- compression ratio ---"
          APK_SIZE=$(stat -c %s "$APK")
          SEVENZ_SIZE=$(stat -c %s "${APK_BASE}.7z")
          echo "APK: $APK_SIZE bytes ($(($APK_SIZE / 1024 / 1024)) MB)"
          echo "7z:  $SEVENZ_SIZE bytes ($(($SEVENZ_SIZE / 1024 / 1024)) MB)"
          echo "ratio: $(echo "scale=1; $SEVENZ_SIZE * 100 / $APK_SIZE" | bc)%"
          ls -la

      - name: "Create / update rolling Release (tag: latest)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Leica Perfect v6.4.8 ABSOLUTE (mode_max — Leica M9 LUT — night precision — DEBUG build)
          body: |
            # Leica Perfect v6.4.8 ABSOLUTE

            Photon Camera fork — built from upstream `bjzhou/PhotonCamera` 1.26.1
            + surgical patches (Cron 17: night precision — flat+noisy fix).

            ## ABSOLUTE build
            - **No mod menu** — mode_max is baked from JSON config (no UI to change it)
            - ccache enabled for faster native builds
            - **Capture mode: `mode_max`** (ONLY mode — mode_fast removed in v6.4.6)
            - 15/9/7/11 frames, super-res 2.0x, NLM radius 7, JPEG/HEIC/UltraHDR Q100
            - Optimized for **Xiaomi 15T** (OV50E + S5KJN1 + S5K3J1 + OV32B)
            - **JPEG by default; RAW available on-demand** via gear icon → RAW toggle (v6.4.5)
            - **v6.4.6: Release build** — R8 minified + arm64-v8a only (~50% smaller APK)
            - **v6.4.7: Natural baseline** — LUT "none" no perfil ativo (DCP Leica M8 + AgX + sharpening)
            - **v6.4.7-fix2: DEBUG build** — reverted from release to debug build for guaranteed installability (release build had "parse error" on Xiaomi 15T)
            - **v6.4.8: Night precision** — revert P-75 LUT leica_m9 (flat+noisy fix) + AgX shadow_lift 0.10→0.05 + pgtm boost 1.3→0.8 + NR luma 0.92→0.96

            ## What's new in v6.4.8 (P-76 night precision)
            - **P-76.1: revert LUT leica_m9** — P-75 (v6.4.7) set lut_id="none" which removed Leica M9 CCD
              color science (rich colors + contrast + noise masking). Night photos at ISO 1500-3275 came out
              FLAT and NOISY. Revert restores Leica M9 look + masks sensor grain.
            - **P-76.2: force_baseline_lut_id="leica_m9"** — case-sensitive correct ID. The latent bug
              from v6.4.6 era ("Leica_M9_STD" filename that never resolved in LutManager.getLutInfo)
              STAYS FIXED with the correct ID "leica_m9".
            - **P-76.3: AgX shadow_lift 0.10→0.05** — -50% shadow lift. Less sensor noise reveal in shadows.
            - **P-76.4: pgtm_pre_tonemap_exposure_boost_ev 1.3→0.8** — -38% pre-tonemap boost. ISO 1500-3000
              noise no longer amplified ~5x by AgX lift.
            - **P-76.5: noise_reduction.luminance 0.92→0.96** — +4% luma NR. Compensates mode_max night ISO
              without plasticizing (detail_preserve 0.96 retained).
            - **Diagnosis**: EXIF comparison (Stock ISO 1000 1/30s clean vs Photon ISO 1506 1/59s flat+noisy,
              same room 5 min apart) + VLM analysis (Photon underexposed/flat/noisy, Stock bright/vivid/clean).
              3 root causes: (1) P-75 LUT=none removed color+masking, (2) AgX +2.3EV lift amplified noise 5x,
              (3) NR luma 0.92 insufficient for ISO 1500-3000.

            ## What's new in v6.4.7 (previous — P-75, now reverted by P-76)
            - **P-75 natural baseline (LUT none)**: removed Leica M9 CCD color science for "natural" look.
              REVERTED in v6.4.8 P-76.1 — flat+noisy at night.
            - **P-75 latent bug fix**: force_baseline_lut_id "Leica_M9_STD"→"none"→"leica_m9" (v6.4.8).
              Bug STAYS FIXED with correct case-sensitive ID.

            ## What's new in v6.4.6 (older)
            - **P-73 mode_fast removed**: single capture mode (mode_max only). Thermal throttle is warning-only.
            - **P-74 Release APK + R8**: switched from debug to release build. R8 + arm64-v8a (~50% smaller APK).
            - **v6.4.7-fix2**: reverted to DEBUG build (release had "parse error" on Xiaomi 15T).

            ## What's new in v6.4.5 (older)
            - **P-72 RAW on-demand**: flipped `force_no_raw`/`force_no_dng` true→false
            - **P-71 composition aids ON**: grid + horizon level + DNG-with-RAW export
            - **P-69 photo quality**: NR Off, Sharpening HQ, JPEG Q100 4:4:4, P010 10-bit
            - **P-70 video 4K stability**: bitrate 250→120 Mbps, muxer.stop() fix
            - ⚠️ **Clear Data** after install (Android Settings → Apps → Photon Camera) to apply P-69/P-71 defaults

            ## Download
            ### Option A — single APK (easiest)
            Download `LeicaPerfect-v6.4.8-debug.apk` and install.

            ### Option B — 7z supercompressed (smallest download)
            Download `LeicaPerfect-v6.4.8-debug.apk.7z` (LZMA2 max compression).
            Extract with: `7z x LeicaPerfect-v6.4.8-debug.apk.7z`

            ### Option C — fragments (parallel / resumable)
            Grab the `.part*` files + `reassemble.sh` + `fragments.sha256` and run `bash reassemble.sh`.

            ---
            Build commit: ${{ github.sha }}
            Built at: ${{ github.run_id }}
          files: |
            apk/*.apk
            apk/*.apk.part*
            apk/*.apk.7z
            apk/reassemble.sh
            apk/apk.sha256
            apk/fragments.sha256
            apk/7z.sha256
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            /tmp/photon_upstream/**/*.log
            /tmp/leica_build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
