# ═══════════════════════════════════════════════════════════════════════════════
# MANIFEST.toml — Photon Camera Leica Perfect v6.5.0 — Patch Registry
# ═══════════════════════════════════════════════════════════════════════════════
# Single source of truth for all 84 patches (P-1..P-78 + U-01..U-06).
# Validated by tests/lint_manifest.py on every PR via .github/workflows/quality.yml.
#
# Schema:
#   id          = "P-NN" or "U-NN"           (string, unique, required)
#   title       = "<short description>"       (string, required)
#   category    = "<one of categories above>" (string, required)
#   version     = "<fork version introduced>" (string, e.g. "6.4.10")
#   file        = "<where the patch logic lives>" (string, file path)
#   line        = <line number in file>      (integer)
#   affects     = ["File1.kt", "File2.kt"]   (array of strings, .kt basenames)
#   depends_on  = ["P-NN", ...]              (array of strings, can be empty)
#   status      = "active" | "deprecated" | "documentation-only"
#
# Categories:
#   CORE_TONE_MAPPING      P-1..P-7      — tone mapping, sharpening, NLM, metering, config loader
#   MULTI_FRAME_HDR        P-8..P-20     — multi-frame, HDR, demosaic, processing, DCP
#   METRICS_EXPORT         P-21..P-28    — Mertens, vignette, DNG, JPEG/HEIC, branding, ISP
#   PER_LENS               P-29..P-36+P-50 — v6.0 per-lens intelligence
#   WIRING                 P-37..P-43    — v6.1+v6.2 wiring white/black level, DCP ratio, SR DNG, AgX, gainmap
#   RUNTIME_ACTIVATION     P-44..P-45    — v6.2.5 runtime activation + branding
#   UI                     P-46..P-48    — v6.2.6 UI settings panel, viewfinder button, runtime state
#   RUNTIME_NLM            P-49..P-53    — v6.3.x runtime wiring, Live Photo, NLM radius
#   COLOR_SCIENCE          P-54          — v6.3.6 creative profile color science
#   VIDEO                  P-55,P-56,P-70 — video settings + encoder + 4K stability
#   CAMERA2_PARAMS         P-57..P-59    — Camera2 direct params, noise model, thermal
#   BUILD_FIXES            P-60..P-61    — doNotStrip + LeicaStateDumper
#   CAPTURE_MODES          P-62..P-65    — v6.4.0 drop RAW + 2 modes + LUT picker + one-click max
#   UI_LUT                 P-67..P-68    — v6.4.1-4.2 LUT picker runtime
#   PHOTO_QUALITY          P-69          — v6.4.3 photo quality defaults
#   COMPOSITION            P-71          — v6.4.4 composition aids
#   RAW_ON_DEMAND          P-72          — v6.4.5 RAW on-demand
#   BUILD_OPTIMIZATION     P-66,P-73,P-74 — ccache, mode_fast removal, Release APK + R8
#   NATURAL_BASELINE       P-75..P-76    — v6.4.7-4.8 natural baseline + night precision
#   NIGHT_DENOISE          P-77..P-78    — v6.4.9-4.10 real night denoise + wire NR to algorithm
#   V6_5_UPGRADES          U-01..U-06    — v6.5 VLM-driven pipeline fixes (applied via P-79)
# ═══════════════════════════════════════════════════════════════════════════════


